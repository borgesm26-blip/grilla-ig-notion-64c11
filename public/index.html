<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grilla IG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="widget">
    <div class="barra" role="toolbar" aria-label="Controles">
      <button class="btn-barra" id="btn-refresh" title="Actualizar desde Notion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        <span>Refresh</span>
      </button>
      <div class="segmento" role="group" aria-label="Cantidad de posts">
        <button data-filas="3" class="activo">9</button>
        <button data-filas="4">12</button>
      </div>
      <button class="btn-barra icono" id="btn-tema" title="Modo claro / oscuro" aria-label="Cambiar tema">
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span class="estado" id="estado" aria-live="polite"></span>
    </div>

    <div class="aviso" id="aviso" hidden></div>

    <main class="perfil" id="perfil">
      <header class="top">
        <svg class="candado" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <h1 class="usuario" id="usuario">tu_marca</h1>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <span class="espacio"></span>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </header>

      <section class="cabecera">
        <div class="avatar"><img id="foto" alt=""></div>
        <div class="stats">
          <div><b id="n-posts">0</b><span>publicaciones</span></div>
          <div><b id="n-seguidores">0</b><span>seguidores</span></div>
          <div><b id="n-seguidos">0</b><span>seguidos</span></div>
        </div>
      </section>

      <section class="info">
        <p class="nombre" id="nombre"></p>
        <p class="categoria" id="categoria"></p>
        <p class="bio" id="bio"></p>
        <a class="link" id="link" target="_blank" rel="noopener"></a>
      </section>

      <div class="botones">
        <span class="boton">Editar perfil</span>
        <span class="boton">Compartir perfil</span>
      </div>

      <section class="destacadas" id="destacadas"></section>

      <nav class="tabs" aria-hidden="true">
        <span class="tab activo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></span>
        <span class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 9 5 3-5 3z"/></svg></span>
        <span class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1-3.5 4-5 7-5s6 1.5 7 5"/><rect x="2.5" y="2.5" width="19" height="19" rx="3"/></svg></span>
      </nav>

      <section class="grilla" id="grilla" aria-label="Grilla de posts"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
